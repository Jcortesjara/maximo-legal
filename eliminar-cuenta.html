<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eliminar cuenta – MAXIMO</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f9f8f6;
      --text: #1a1a1a;
      --muted: #595959;
      --subtle: #7f7f7f;
      --accent: #003afa;
      --border: #e0ddd8;
      --section-bg: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      padding: 2rem 1rem 4rem;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
      background: var(--section-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 3rem 3.5rem;
    }

    .brand {
      font-family: 'DM Serif Display', serif;
      font-size: 1.4rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text);
      margin-bottom: 2.5rem;
      display: inline-block;
      border-bottom: 2px solid var(--text);
      padding-bottom: 0.3rem;
    }

    h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 2rem;
      font-weight: 400;
      line-height: 1.2;
      margin-bottom: 0.4rem;
    }

    .subtitle {
      color: var(--subtle);
      font-size: 0.875rem;
      margin-bottom: 2rem;
    }

    hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 2rem 0;
    }

    p {
      font-size: 0.9375rem;
      color: var(--muted);
      margin-bottom: 1rem;
    }

    ol {
      padding-left: 1.5rem;
      margin-bottom: 1rem;
    }

    ol li {
      font-size: 0.9375rem;
      color: var(--muted);
      margin-bottom: 0.4rem;
    }

    .summary-box {
      background: var(--bg);
      border-left: 3px solid var(--accent);
      padding: 1rem 1.25rem;
      border-radius: 0 8px 8px 0;
      margin: 1.5rem 0;
    }

    .summary-box p {
      margin-bottom: 0;
      font-size: 0.875rem;
    }

    @media (max-width: 600px) {
      .container { padding: 1.75rem 1.25rem; }
      h1 { font-size: 1.5rem; }
    }
  </style>
</head>
<body>
<div class="container">

  <div class="brand">MAXIMO</div>

  <h1>ELIMINAR TU CUENTA</h1>
  <p class="subtitle">Última actualización: 28 de abril de 2026</p>

  <hr>

  <p>Para eliminar tu cuenta:</p>
  <ol>
    <li>Abre Maximo.</li>
    <li>Ve a la pestaña <strong>“Mi mascota”</strong>.</li>
    <li>Desplázate al final.</li>
    <li>Toca <strong>“Eliminar cuenta”</strong>.</li>
  </ol>

  <div class="summary-box">
    <p><strong>Importante:</strong> Todos tus datos se borran permanentemente.</p>
  </div>

</div>
</body>
</html>
